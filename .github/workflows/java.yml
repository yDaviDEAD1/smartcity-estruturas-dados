name: Compilar e testar
on: [push, pull_request, workflow_dispatch]
jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: sh executar.sh testes
